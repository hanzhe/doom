<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom</title>
<link rel="stylesheet" href="style/app.css">
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<div id="status">Loading…</div>
<div id="help" hidden>
  <h1>Controls</h1>
  <dl>
    <dt>▲ ▼ ◀ ▶</dt><dd>move and turn</dd>
    <dt>OK</dt><dd>fire, choose in menus</dd>
    <dt>5 · Call</dt><dd>open doors, use switches</dd>
    <dt>4 · 6</dt><dd>strafe</dd>
    <dt>1 · 3</dt><dd>previous / next weapon</dd>
    <dt>0 · Right key</dt><dd>map</dd>
    <dt>#</dt><dd>always run on / off</dd>
    <dt>Left key · Back</dt><dd>menu</dd>
    <dt>*</dt><dd>this help</dd>
  </dl>
  <p>Press any key</p>
</div>

<script src="js/keys.js"></script>
<script src="js/files.js"></script>
<script src="js/sound.js"></script>
<script src="js/main.js"></script>
<script src="js/doom.js"></script>
</body>
</html>
